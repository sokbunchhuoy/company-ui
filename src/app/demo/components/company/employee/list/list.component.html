<div class="content">
    <div class="grid align-items-center app-header-list">
        <div class="col-6">
            <h5 class="component-header mb-0">{{pageName}}</h5>
        </div>
        <div class="col-6 text-right">
            <button pButton label="Create" icon="pi pi-plus" class="p-button-success mr-2"
                    [routerLink]="['/page/company/employee/add']"></button>
            <button pButton label="Crush" icon="pi pi-plus" class="p-button-success mr-2"
                    [routerLink]="['/page/company/employee/crush']"></button>
            <button pButton label="Detail" icon="pi pi-users" class="p-button-success mr-2"
                    [routerLink]="['/page/company/employee/detail']"></button>
            <button pButton label="Scann" icon="pi pi-users" class="p-button-success mr-2"
                    [routerLink]="['/page/company/employee/qr']"></button>
        </div>
    </div>
    <div class="card py-0 mt-3">
        <form [formGroup]="f">
            <div class="filter grid p-fluid">
                <div class="col">
                    <input pInputText type="text" formControlName="name" placeholder="Search..." />
                </div>
                <div class="col-fixed search-btn">
                    <button pButton icon="pi pi-search" type="submit" label="Search"></button>
                </div>
                <div class="col-fixed search-btn">
                    <button pButton icon="pi pi-refresh" class="p-button-secondary" type="button"
                            label="Refresh" (click)="refresh()"></button>
                </div>
            </div>
        </form>

    </div>
    <app-loading [isLoading]="isLoading"></app-loading>
    <div class="card p-0 overflow-hidden">
        <p-table
            [value]="employees" paginatorDropdownAppendTo="body"
            sortMode="multiple"
            [paginator]="true" [rows]="10" [showCurrentPageReport]="true" responsiveLayout="scroll"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [rowsPerPageOptions]="[10,25,50]"
            [globalFilterFields]="['name','position','department']">
            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
                    <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
                    <th pSortableColumn="position.name">Position <p-sortIcon field="position.name"></p-sortIcon></th>
                    <th pSortableColumn="department">Department <p-sortIcon field="department"></p-sortIcon></th>
                    <th pSortableColumn="salary">Salary <p-sortIcon field="salary"></p-sortIcon></th>
                    <th pSortableColumn="hireDate">Hire Date <p-sortIcon field="hireDate"></p-sortIcon></th>
                    <th class="col-action">Action</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-emp>
                <tr>
                    <td>{{ emp.id }}</td>
                    <td>{{ emp.name }}</td>
                    <td>{{ emp.position.name}}</td>
                    <td>{{ emp.department }}</td>
                    <td>{{ emp.salary | currency }}</td>
                    <td>{{ emp.hireDate | date: 'MM/dd/yyyy'}}</td>
                    <td class="col-action">
                        <div class="flex">
                            <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2" [routerLink]="['/page/company/employee/edit', emp.id]"></button>
                            <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning" [disabled]="isLoading" (click)="deleteEmployee(emp)"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
<p-confirmDialog></p-confirmDialog>
<p-toast position="top-right"></p-toast>
